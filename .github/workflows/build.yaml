name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 9 * * *'
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:

    runs-on: mac-mini-build-02

    env:
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
        lfs: true

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.5
        cache: false

    - name: Cache the Jekyll dependencies
      uses: actions/cache@v6
      with:
        path: site/vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('site/Gemfile.lock') }}
        restore-keys: ${{ runner.os }}-gems-

    - name: Install dependencies
      run: scripts/install-dependencies.sh

    - name: Run the tests
      run: |
        scripts/test.sh

    - name: Build the index
      env:
        INDEXER_ASSETS_DIRECTORY: /Users/jbmorley/psion-software-index/assets
        INDEXER_INTERMEDIATES_DIRECTORY: /Users/jbmorley/psion-software-index/intermediates
      run: |
        mkdir -p "$INDEXER_ASSETS_DIRECTORY"
        mkdir -p "$INDEXER_INTERMEDIATES_DIRECTORY"
        uv run indexer libraries/full.yaml sync index group overlay

    - name: Validate the API
      run: |
        scripts/validate.sh

    - name: Archive the summary
      uses: actions/upload-artifact@v6
      with:
        name: summary
        path: site/_data/summary.json
        if-no-files-found: error

    - name: Build site
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        scripts/build-site.sh
        chmod -v -R +rX "_site/"

    - name: Deploy site
      if: github.ref == 'refs/heads/main'
      env:
        ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASS }}
      run: |
        ansible/deploy.py

    - name: Package and optionally release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE: ${{ github.ref == 'refs/heads/main' }}
      run: |
        scripts/package.sh
