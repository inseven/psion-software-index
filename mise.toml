[tools]

gh = "2.103.3"
node = "24.22.2"
python = "3.15.2"
ruby = "4.0.9"
uv = "latest"
yq = "latest"

"pipx:changes-semver" = "6.0.8"
"pipx:inseven-build-tools" = "1.3.1"

[env]

# Ensure uv uses the Python provisioned by mise above rather than silently
# downloading an interpreter of its own.
UV_PYTHON_PREFERENCE = "only-system"
